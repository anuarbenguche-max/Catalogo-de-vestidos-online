<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noche & Día Dress Rental - Catálogo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #ffb6c1;
            color: white;
            text-align: center;
            padding: 2.2rem 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            letter-spacing: 2px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 1.1em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
            text-align: center;
        }

        /* Barra de filtros por categoría */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 35px;
        }

        .filter-btn {
            background-color: white;
            color: #555;
            border: 2px solid #ffb6c1;
            border-radius: 25px;
            padding: 10px 22px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: none;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: #ffb6c1;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
        }

        /* Títulos de sección de categoría */
        .category-section {
            margin-bottom: 50px;
            text-align: left;
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            color: #2c3e50;
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        /* AJUSTE PARA MANTENER EL TAMAÑO DE LAS TARJETAS */
        .gallery {
            display: grid;
            /* Usamos auto-fill en lugar de auto-fit para evitar que un solo elemento se expanda */
            grid-template-columns: repeat(auto-fill, minmax(280px, 320px)); 
            gap: 28px;
            justify-content: center; /* Centra las tarjetas si hay pocas */
        }

        .item {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%; /* Asegura que respete las medidas del grid */
            max-width: 320px; /* Tamaño máximo fijo */
            margin: 0 auto; /* Centra la tarjeta en su espacio */
        }

        .item:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .img-container {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: #ffe6ea;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: zoom-in;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .item:hover img {
            transform: scale(1.04);
        }

        .category-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(44, 62, 80, 0.85);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.78em;
            font-weight: 500;
            z-index: 3;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .color-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(255, 182, 193, 0.9);
            color: #2c3e50;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.78em;
            font-weight: 600;
            z-index: 3;
            pointer-events: none;
        }

        .zoom-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.55);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            z-index: 3;
            pointer-events: none;
        }

        .item-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 5px;
        }

        .item-info p {
            margin: 0;
            color: #333;
        }

        .item-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px !important;
        }

        .item-desc {
            font-size: 0.9em;
            color: #666 !important;
            margin-bottom: 10px !important;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-meta {
            font-size: 0.95em;
            font-weight: 500;
        }

        .price-text {
            color: #2c3e50 !important;
            font-weight: 600;
        }
        
        .deposit-text {
             color: #e67e22 !important;
             font-size: 0.85em;
             margin-top: 2px !important;
        }

        .btn-consultar {
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 11px 24px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            width: 80%;
            margin: 10px auto 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.25);
            transition: background-color 0.25s ease, transform 0.2s ease;
        }

        .btn-consultar:hover {
            background-color: #1ebe5d;
            transform: scale(1.03);
        }

        /* Visor de imagen en pantalla completa (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 18px;
            right: 25px;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-img {
            max-width: 92%;
            max-height: 75vh;
            border-radius: 10px;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .lightbox-caption {
            color: white;
            margin: 15px 0 12px;
            font-size: 1.15em;
            font-weight: 500;
            text-align: center;
        }
        
        .lightbox-desc {
            color: #ddd;
            margin: 0 0 15px;
            font-size: 0.95em;
            text-align: center;
            max-width: 80%;
        }

        .lightbox .btn-consultar {
            width: auto;
            min-width: 200px;
            padding: 12px 30px;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 60px;
        }

        footer h2 {
            margin: 0 0 10px 0;
            font-family: 'Playfair Display', serif;
            color: #ffb6c1;
            font-size: 1.8em;
        }

        footer p {
            margin: 8px 0;
            font-size: 1em;
            color: #e0e6ed;
        }

        .footer-phones {
            margin: 18px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .footer-whatsapp {
            background-color: rgba(255, 255, 255, 0.1);
            color: #25D366;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: background-color 0.3s ease;
        }

        .footer-whatsapp:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .copyright {
            margin-top: 25px;
            font-size: 0.85em;
            color: #95a5a6;
        }
        
        .loading-text {
            font-size: 1.2em;
            color: #666;
            margin: 40px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

<header>
    <h1>Noche & Día Dress Rental</h1>
    <p>Catálogo de Renta de Vestidos</p>
</header>

<div class="container">
    <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" id="btn-todas" onclick="filtrarCategoria('Todas', this)" style="display: none;">Todas las categorías</button>
    </div>

    <div id="catalog-content">
        <p class="loading-text" id="loading-msg">Conectando con el inventario...</p>
    </div>
</div>

<div id="lightbox" class="lightbox" onclick="cerrarLightbox(event)">
    <span class="lightbox-close" onclick="cerrarLightbox(event)">&times;</span>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
    <p id="lightbox-caption" class="lightbox-caption"></p>
    <p id="lightbox-desc" class="lightbox-desc"></p>
    <button id="lightbox-btn" class="btn-consultar">📲 Consultar</button>
</div>

<footer>
    <h2>Noche & Día Dress Rental</h2>
    <p>Contáctanos por WhatsApp:</p>
    <div class="footer-phones">
        <a href="https://wa.me/50488444569" class="footer-whatsapp" target="_blank">📲 8844-4569</a>
        <a href="https://wa.me/50496113944" class="footer-whatsapp" target="_blank">📲 9611-3944</a>
    </div>
    <p class="copyright">&copy; 2026 Noche & Día Dress Rental. Todos los derechos reservados.</p>
</footer>

<script>
    // === ENLACE PÚBLICO DEL CSV DE GOOGLE SHEETS ===
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSR8LUiz6js9SmZ7gYMUOCTBPubAjDr-PUX1FpH6jbFY9I7DSR_cnRo6zc64T0MhItQb0TokMIMl4jY/pub?gid=0&single=true&output=csv'; 
    
    const whatsappNumbers = ['50488444569', '50496113944'];
    let vestidosData = [];
    let categoriasUnicas = [];

    async function cargarDatos() {
        try {
            const response = await fetch(CSV_URL);
            const data = await response.text();
            procesarCSV(data);
        } catch (error) {
            console.error("Error cargando el CSV:", error);
            document.getElementById('loading-msg').innerHTML = "Ocurrió un error al cargar el inventario. Revisa el enlace del Google Sheet.";
        }
    }

    function procesarCSV(csvText) {
        // Mejor analizador de CSV que ignora saltos de línea erróneos dentro de celdas
        const rows = parseCSVAdvanced(csvText);
        if (rows.length < 2) return;
        
        vestidosData = [];
        categoriasUnicas = new Set();

        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i];
            
            // Asumiendo el orden: ID(0), Nombre(1), Categoría(2), Talla(3), Precio(4), Depósito(5), Descripción(6), URL(7), Color(8)
            if (cols.length >= 8 && cols[1] && cols[7]) {
                const categoria = cols[2] ? cols[2].trim() : 'Sin Categoría';
                categoriasUnicas.add(categoria);

                vestidosData.push({
                    id: cols[0],
                    nombre: cols[1],
                    categoria: categoria,
                    talla: cols[3] || 'N/A',
                    precio: cols[4] || 'Consultar',
                    deposito: cols[5] || 'Consultar',
                    descripcion: cols[6] ? cols[6].replace(/\n/g, ' ') : '', // Elimina saltos de línea en descripción
                    url: cols[7].trim(),
                    color: cols[8] || '' // Nueva columna Color
                });
            }
        }

        categoriasUnicas = Array.from(categoriasUnicas).sort();
        
        construirFiltros();
        document.getElementById('loading-msg').style.display = 'none';
        renderCatalogo('Todas');
    }

    // Analizador avanzado para evitar que saltos de línea accidentales en Excel rompan la tabla
    function parseCSVAdvanced(text) {
        let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
        for (l of text) {
            if ('"' === l) {
                if (s && l === p) row[i] += l;
                s = !s;
            } else if (',' === l && s) l = row[++i] = '';
            else if ('\n' === l && s) {
                if ('\r' === p) row[i] = row[i].slice(0, -1);
                row = ret[++r] = [l = '']; i = 0;
            } else row[i] += l;
            p = l;
        }
        return ret;
    }

    function construirFiltros() {
        const filterBar = document.getElementById('filter-bar');
        const btnTodas = document.getElementById('btn-todas');
        btnTodas.style.display = 'inline-block'; 

        categoriasUnicas.forEach(cat => {
            if(cat !== 'Sin Categoría'){
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.style.display = 'inline-block';
                btn.textContent = cat;
                btn.onclick = function() { filtrarCategoria(cat, this); };
                filterBar.appendChild(btn);
            }
        });
    }

    function renderCatalogo(filtro = 'Todas') {
        const catalogContent = document.getElementById('catalog-content');
        catalogContent.innerHTML = '';
        
        if (vestidosData.length === 0) {
            catalogContent.innerHTML = '<p class="loading-text">No hay vestidos registrados aún.</p>';
            return;
        }

        const categoriasAMostrar = filtro === 'Todas' ? categoriasUnicas : [filtro];

        categoriasAMostrar.forEach(cat => {
            const vestidosCat = vestidosData.filter(v => v.categoria === cat);
            if (vestidosCat.length === 0) return;

            const section = document.createElement('div');
            section.className = 'category-section';

            const title = document.createElement('h2');
            title.className = 'category-title';
            title.textContent = cat;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'gallery';

            vestidosCat.forEach(vestido => {
                const card = document.createElement('div');
                card.className = 'item';
                const nombreSeguro = vestido.nombre.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const descSegura = vestido.descripcion.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                
                const descHtml = vestido.descripcion ? `<p class="item-desc">${vestido.descripcion}</p>` : '';
                const colorHtml = vestido.color ? `<span class="color-badge">${vestido.color}</span>` : '';
                
                card.innerHTML = `
                    <div>
                        <div class="img-container" onclick="abrirLightbox(this, '${nombreSeguro}', '${descSegura}')">
                            <span class="category-badge">${vestido.talla}</span>
                            ${colorHtml}
                            <span class="zoom-hint">🔍 Ver completo</span>
                            <img src="${vestido.url}" alt="${vestido.nombre}" onerror="this.src='https://via.placeholder.com/400x500/ffe6ea/d88ca8?text=Foto+no+encontrada'">
                        </div>
                        <div class="item-info">
                            <p class="item-title">${vestido.nombre}</p>
                            ${descHtml}
                            <p class="item-meta price-text">Alquiler: ${vestido.precio}</p>
                            <p class="item-meta deposit-text">Depósito: ${vestido.deposito}</p>
                        </div>
                    </div>
                    <button class="btn-consultar" onclick="consultarVestido('${nombreSeguro}', '${vestido.url}')">
                        📲 Consultar
                    </button>
                `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            catalogContent.appendChild(section);
        });
    }

    function filtrarCategoria(categoria, btnElement) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        renderCatalogo(categoria);
    }

    function abrirLightbox(container, nombre, descripcion) {
        const imgElement = container.querySelector('img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxDesc = document.getElementById('lightbox-desc');
        const lightboxBtn = document.getElementById('lightbox-btn');

        lightboxImg.src = imgElement.src;
        lightboxImg.alt = nombre;
        lightboxCaption.textContent = nombre;
        lightboxDesc.textContent = descripcion;
        
        lightboxBtn.onclick = function(e) {
            e.stopPropagation();
            consultarVestido(nombre, imgElement.src);
        };

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function cerrarLightbox(event) {
        if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
    });

    function consultarVestido(nombre, urlImagen) {
        const randomIndex = Math.floor(Math.random() * whatsappNumbers.length);
        const numeroElegido = whatsappNumbers[randomIndex];
        const mensaje = encodeURIComponent(`¡Hola Noche & Día Dress Rental! 🌸 Me interesa consultar por el vestido: *${nombre}*\n\nFoto del vestido: ${urlImagen}`);
        window.open(`https://wa.me/${numeroElegido}?text=${mensaje}`, '_blank');
    }

    window.onload = cargarDatos;
</script>

</body>
</html>
