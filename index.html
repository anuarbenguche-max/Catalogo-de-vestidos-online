<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariela's Store - Catálogo de Vestidos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #ffb6c1;
            color: white;
            text-align: center;
            padding: 2.2rem 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            letter-spacing: 2px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 1.1em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
        }

        .item {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .img-container {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: #ffe6ea;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .item:hover img {
            transform: scale(1.04);
        }

        .fallback-text {
            color: #d88ca8;
            font-weight: 500;
            font-size: 1.1em;
            padding: 20px;
            text-align: center;
            z-index: 1;
        }

        .item p {
            margin: 15px 0 12px 0;
            font-size: 1.05em;
            color: #333;
            padding: 0 15px;
            font-weight: 500;
        }

        .btn-consultar {
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 11px 24px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            width: 80%;
            margin: 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.25);
            transition: background-color 0.25s ease, transform 0.2s ease;
        }

        .btn-consultar:hover {
            background-color: #1ebe5d;
            transform: scale(1.03);
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 60px;
        }

        footer h2 {
            margin: 0 0 10px 0;
            font-family: 'Playfair Display', serif;
            color: #ffb6c1;
            font-size: 1.8em;
        }

        footer p {
            margin: 8px 0;
            font-size: 1em;
            color: #e0e6ed;
        }

        .footer-phones {
            margin: 18px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .footer-whatsapp {
            background-color: rgba(255, 255, 255, 0.1);
            color: #25D366;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: background-color 0.3s ease;
        }

        .footer-whatsapp:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .copyright {
            margin-top: 25px;
            font-size: 0.85em;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<header>
    <h1>Mariela's Store</h1>
    <p>Catálogo de Renta de Vestidos</p>
</header>

<div class="container">
    <div id="gallery" class="gallery"></div>
</div>

<footer>
    <h2>Mariela's Store</h2>
    <p>Contáctanos por WhatsApp:</p>
    <div class="footer-phones">
        <a href="https://wa.me/50488444569" class="footer-whatsapp" target="_blank">📲 8844-4569</a>
        <a href="https://wa.me/50496113944" class="footer-whatsapp" target="_blank">📲 9611-3944</a>
    </div>
    <p class="copyright">&copy; 2026 Mariela's Store. Todos los derechos reservados.</p>
</footer>

<script>
    const vestidos = [
        { id: 1, nombre: "Vestido largo vino con abertura" },
        { id: 2, nombre: "Vestido tipo chaleco largo blanco" },
        { id: 3, nombre: "Vestido largo asimétrico rosa palo" },
        { id: 4, nombre: "Vestido cruzado beige floral" },
        { id: 5, nombre: "Vestido largo azul con estampado geométrico" },
        { id: 6, nombre: "Vestido corto verde claro estampado" },
        { id: 7, nombre: "Conjunto marrón falda asimétrica y saco" },
        { id: 8, nombre: "Vestido rosa viejo manga corta escote en V" },
        { id: 9, nombre: "Vestido corto color nude ajustado manga larga" },
        { id: 10, nombre: "Vestido largo celeste floral escote V" },
        { id: 11, nombre: "Vestido largo amarillo mostaza cuello halter" },
        { id: 12, nombre: "Vestido sin mangas diseño blanco y negro" },
        { id: 13, nombre: "Vestido corto rosa con corazones blancos" },
        { id: 14, nombre: "Vestido corto marrón suelto manga corta" },
        { id: 15, nombre: "Vestido rojo midi asimétrico con olanes" },
        { id: 16, nombre: "Vestido midi camisero color arena" },
        { id: 17, nombre: "Vestido largo un hombro gris metálico" },
        { id: 18, nombre: "Vestido corto beige escote profundo manga larga" },
        { id: 19, nombre: "Vestido camisero rojo con estampado floral" },
        { id: 20, nombre: "Vestido largo nude bordado en lentejuelas" },
        { id: 21, nombre: "Vestido largo rayas azul marino y blanco" },
        { id: 22, nombre: "Enterizo azul rey asimétrico" },
        { id: 23, nombre: "Vestido corto blanco manga larga botones" },
        { id: 24, nombre: "Vestido largo morado escote recto con abertura" },
        { id: 25, nombre: "Vestido midi verde esmeralda tirantes" },
        { id: 26, nombre: "Vestido corto blanco flores rosas" },
        { id: 27, nombre: "Vestido asimétrico fucsia y rojo" },
        { id: 28, nombre: "Vestido corto negro manga larga asimétrico" },

        { id: 36, nombre: "Vestido corto manga larga cuello alto floral" },
        { id: 37, nombre: "Vestido corto beige estampado hojas de colores" }
    ];

    const whatsappNumbers = ['50488444569', '50496113944'];
    const gallery = document.getElementById('gallery');

    // Función de respaldo por si alguna imagen tiene extensión .jpg o .JPEG en vez de .jpeg
    function handleImgError(img, id) {
        if (!img.dataset.triedJpg) {
            img.dataset.triedJpg = "true";
            img.src = `images/${id}.jpg`;
        } else if (!img.dataset.triedUpper) {
            img.dataset.triedUpper = "true";
            img.src = `images/${id}.JPEG`;
        } else {
            img.style.display = 'none';
        }
    }

    vestidos.forEach(vestido => {
        const card = document.createElement('div');
        card.className = 'item';
        card.innerHTML = `
            <div>
                <div class="img-container">
                    <span class="fallback-text">${vestido.nombre}</span>
                    <img src="images/${vestido.id}.jpeg" alt="${vestido.nombre}" onerror="handleImgError(this, ${vestido.id})">
                </div>
                <p>${vestido.nombre}</p>
            </div>
            <button class="btn-consultar" onclick="consultarVestido(${vestido.id}, '${vestido.nombre.replace(/'/g, "\\'")}')">
                📲 Consultar
            </button>
        `;
        gallery.appendChild(card);
    });

    function consultarVestido(id, nombre) {
        const randomIndex = Math.floor(Math.random() * whatsappNumbers.length);
        const numeroElegido = whatsappNumbers[randomIndex];
        const baseUrl = window.location.href.split('#')[0].replace(/index\.html$/, '');
        const urlImagen = `${baseUrl}images/${id}.jpeg`;
        const mensaje = encodeURIComponent(`¡Hola Mariela's Store! 🌸 Me interesa consultar por el vestido: *${nombre}*\n\nFoto del vestido: ${urlImagen}`);
        window.open(`https://wa.me/${numeroElegido}?text=${mensaje}`, '_blank');
    }
</script>

</body>
</html>
